mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

{{ conf | except("proxy-groups", "port", "mixed-port", "mode", "rules", "dns") | yaml }}

proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🎯 全球直连
  {{ proxy_remarks | yaml | indent(2) }}
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  {{ proxy_remarks | yaml | indent(2) }}
- name: 🌍 国外媒体
  type: select
  proxies:
  - 🚀 节点选择
  - ♻️ 自动选择
  - 🎯 全球直连
  {{ proxy_remarks | yaml | indent(2) }}
- name: 📲 电报信息
  type: select
  proxies:
  - 🚀 节点选择
  - 🎯 全球直连
  {{ proxy_remarks | yaml | indent(2) }}
- name: Ⓜ️ 微软服务
  type: select
  proxies:
  - 🎯 全球直连
  - 🚀 节点选择
  {{ proxy_remarks | yaml | indent(2) }}
- name: 🍎 苹果服务
  type: select
  proxies:
  - 🎯 全球直连
  - 🚀 节点选择
  {{ proxy_remarks | yaml | indent(2) }}
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - ♻️ 自动选择
- name: 🛑 全球拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - 🎯 全球直连
  - ♻️ 自动选择
  {{ proxy_remarks | yaml | indent(2) }}

