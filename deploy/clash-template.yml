mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 白名单: 这些域名不走假IP。否则连通性检测/局域网发现/实时音视频(UDP)拿到假IP会卡
  fake-ip-filter:
    # 局域网 / 投屏 / 智能家居 (mDNS 设备发现)
    - '*.lan'
    - '*.localdomain'
    - '+.local'
    - '+.home.arpa'
    - '_dns.resolver.arpa'
    # 微信 / QQ / 腾讯 (发图、语音、连通检测)
    - '+.qq.com'
    - '+.qpic.cn'
    - '+.qlogo.cn'
    - '+.wechat.com'
    - '+.weixin.qq.com'
    - '+.tencent.com'
    - '+.gtimg.cn'
    - 'localhost.ptlogin2.qq.com'
    # 实时音视频 STUN/TURN (语音/视频通话、会议、游戏打洞)
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.*.*'
    - '+.turn.*.*'
    # 网易云 / 米家 / 智能设备
    - '+.music.163.com'
    - '+.126.net'
    - '+.market.xiaomi.com'
    - '+.mi.com'
    - '+.miui.com'
    - '+.xiaomi.com'
    # 苹果服务 (推送/连通检测/时间)
    - 'courier.push.apple.com'
    - 'captive.apple.com'
    - 'time.*.apple.com'
    - 'time-ios.apple.com'
    - '+.push.apple.com'
    # 系统联网检测 (Win/安卓/Chrome)
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - 'connectivitycheck.platform.hicloud.com'
    - 'connectivitycheck.gstatic.com'
    - 'connect.rom.miui.com'
    - 'wifi.vivo.com.cn'
    # 时间同步 NTP
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - 'pool.ntp.org'
    # 手游 / Steam / PSN (UDP 直连)
    - '+.battlenet.com.cn'
    - '+.blzstatic.cn'
    - '+.battle.net'
    - 'lens.l.google.com'
    - 'safebrowsing.urlsec.qq.com'
    - 'safebrowsing.googleapis.com'
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

{{ conf | except("proxy-groups", "port", "mixed-port", "mode", "rules", "dns") | yaml }}

proxy-groups:
# AI 专线: 走本节点 → 中转 → 客户专属住宅IP (RelayHub 会把节点名带上出口IP)
- name: 🤖 AI 专线
  type: select
  proxies:
  {{ proxy_remarks | yaml | indent(2) }}
# 大流量: 直连大流量机场 (RelayHub 注入机场节点, 绕开本服务器)
- name: 🚀 大流量
  type: select
  proxies:
  - DIRECT
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
- name: 🛑 全球拦截
  type: select
  proxies:
  - REJECT
  - DIRECT

rules:
# 管理服务器自身直连 (开 TUN 也能 SSH/面板; 部署他处改这个 IP)
- IP-CIDR,23.252.105.218/32,🎯 全球直连,no-resolve
# 所有 SSH (22 端口) 直连, 不过代理
- DST-PORT,22,🎯 全球直连
# 局域网 / 私网直连
- DOMAIN-SUFFIX,local,🎯 全球直连
- IP-CIDR,127.0.0.0/8,🎯 全球直连,no-resolve
- IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
