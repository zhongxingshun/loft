mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

{{ conf | except("proxy-groups", "port", "mixed-port", "mode", "rules", "dns") | yaml }}

proxy-groups:
# AI 专线: 走本节点 → 中转 → 客户专属住宅IP (RelayHub 会把节点名带上出口IP)
- name: 🤖 AI 专线
  type: select
  proxies:
  {{ proxy_remarks | yaml | indent(2) }}
# 大流量: 直连大流量机场 (RelayHub 注入机场节点, 绕开本服务器)
- name: 🚀 大流量
  type: select
  proxies:
  - DIRECT
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
- name: 🛑 全球拦截
  type: select
  proxies:
  - REJECT
  - DIRECT

rules:
# 管理服务器自身直连 (开 TUN 也能 SSH/面板; 部署他处改这个 IP)
- IP-CIDR,23.252.105.218/32,🎯 全球直连,no-resolve
# 局域网 / 私网直连
- DOMAIN-SUFFIX,local,🎯 全球直连
- IP-CIDR,127.0.0.0/8,🎯 全球直连,no-resolve
- IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
- IP-CIDR,172.16.0.0/12,🎯 全球直连,no-resolve
- IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve
- IP-CIDR,100.64.0.0/10,🎯 全球直连,no-resolve
- IP-CIDR,169.254.0.0/16,🎯 全球直连,no-resolve
# 广告拦截
