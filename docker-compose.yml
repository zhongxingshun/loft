# ISP IP 中转服务 —— 一键集成栈 (Marzban + Xray + RelayHub)
# 部署: cp .env.example .env && 编辑 .env && bash deploy/setup-reality.sh && docker compose up -d
#
# 暴露面 (SEC-2/3):
#   443         代理入站 (VLESS-Reality), 唯一对外业务端口
#   127.0.0.1:8000  Marzban 面板  (仅本地, SSH 隧道访问)
#   127.0.0.1:8080  RelayHub 面板 (仅本地, SSH 隧道访问)

services:
  marzban:
    image: gozargah/marzban:latest
    restart: always
    environment:
      SUDO_USERNAME: ${MARZBAN_ADMIN_USER}
      SUDO_PASSWORD: ${MARZBAN_ADMIN_PASS}
      # DB 放进持久卷, 否则默认 /code/db.sqlite3 在容器内, 重建容器即丢用户!
      SQLALCHEMY_DATABASE_URL: sqlite:////var/lib/marzban/db.sqlite3
      XRAY_JSON: /code/xray_config.json
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: "8000"
      # Marzban 无 TLS 证书时强制只绑 127.0.0.1。给自签证书让它绑 0.0.0.0,
      # relayhub 才能经内网 https://marzban:8000 访问 (verify 关闭)。
      UVICORN_SSL_CERTFILE: /certs/marzban.crt
      UVICORN_SSL_KEYFILE: /certs/marzban.key
      UVICORN_SSL_CA_TYPE: private       # 允许自签证书 (默认只收受信 CA 证书)
      XRAY_SUBSCRIPTION_URL_PREFIX: ${SUB_URL_PREFIX:-}   # 订阅链接公网前缀, 如 http://<IP>
      # 自定义 Clash/Meta 订阅模板 (带完整分流规则: 国内直连/国外走代理/广告拦截)
      CUSTOM_TEMPLATES_DIRECTORY: /code/custom-templates/
      CLASH_SUBSCRIPTION_TEMPLATE: clash/default.yml
    volumes:
      - marzban_data:/var/lib/marzban
      - ./deploy/xray_config.json:/code/xray_config.json   # 可写: Marzban 改配置(加客户outbound)时要写回
      - ./deploy/certs:/certs:ro
      - ./deploy/clash-template.yml:/code/custom-templates/clash/default.yml:ro
    ports:
      - "443:443"                       # 代理入站, 对公网
      # 面板默认仅本地(SSH隧道); 设 PANEL_HOST=0.0.0.0 则公网开放(自带登录, 强密码)
      - "${PANEL_HOST:-127.0.0.1}:8000:8000"

  relayhub:
    build: ./relayhub
    restart: always
    depends_on:
      - marzban
    environment:
      RELAYHUB_MARZBAN_URL: https://marzban:8000    # 内网 HTTPS(自签), verify 关闭
      RELAYHUB_ADMIN_USER: ${MARZBAN_ADMIN_USER}
      RELAYHUB_ADMIN_PASS: ${MARZBAN_ADMIN_PASS}
      RELAYHUB_SHARED_INBOUND_TAG: VLESS_REALITY
      RELAYHUB_SHARED_INBOUND_PROTOCOL: vless
      RELAYHUB_VERIFY_TLS: "false"
      RELAYHUB_LOCAL_IP: ${LOCAL_IP}
      RELAYHUB_BLOCK_SMTP: ${BLOCK_SMTP:-true}
      RELAYHUB_BLOCK_BITTORRENT: ${BLOCK_BITTORRENT:-false}
      # 告警 (P5): 配齐 token+chat_id 且 interval>0 才会后台推送
      RELAYHUB_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RELAYHUB_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RELAYHUB_ALERT_INTERVAL_MIN: ${ALERT_INTERVAL_MIN:-0}
      RELAYHUB_ALERT_EXPIRE_DAYS: ${ALERT_EXPIRE_DAYS:-3}
      RELAYHUB_ALERT_TRAFFIC_PCT: ${ALERT_TRAFFIC_PCT:-90}
      RELAYHUB_ALERT_CHECK_HEALTH: ${ALERT_CHECK_HEALTH:-false}
      RELAYHUB_PANEL_USER: ${RELAYHUB_PANEL_USER:-admin}
      RELAYHUB_PANEL_PASSWORD: ${RELAYHUB_PANEL_PASSWORD:-}   # 公网开放必配, 否则只走隧道
    ports:
      - "127.0.0.1:8080:8080"           # RelayHub 面板, 仅本地 (公网经 Caddy :8443)

  # 仅暴露订阅 /sub/* 到公网, 面板不经此暴露
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - marzban
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
    ports:
      - "80:80"                          # 订阅入口 (公网)
      - "8443:8443"                      # RelayHub 面板入口 (公网, TLS+鉴权)

volumes:
  marzban_data:
  caddy_data:
